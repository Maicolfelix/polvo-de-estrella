<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Polvo de estrella</title>
<meta name="description" content="MAVO — Polvo de estrella. Nueve puertas, nueve canciones.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,300;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }</script>
</head>
<body>
<a class="saltar" href="#puertas" id="saltar">Ir a las puertas</a>

<canvas id="gl" aria-hidden="true"></canvas>
<div id="velo" aria-hidden="true"></div>

<header class="hud">
  <p class="marca" id="marca"><b>MAVO</b> <span>Polvo de estrella</span></p>
</header>


<div id="puertas" aria-label="Las nueve puertas"></div>
<p class="ayuda" id="ayuda" aria-hidden="true"></p>
<div class="aviso" id="aviso" role="status" aria-live="polite"></div>

<section id="llegada" aria-labelledby="titulo-album">
  <div class="llegada-portada"><img src="img/portada.png" alt="Portada de Polvo de estrella, de MAVO" width="426" height="416"></div>
  <div class="llegada-texto">
    <p class="artista">MAVO</p>
    <h1 id="titulo-album">Polvo de estrella</h1>
    <p class="llegada-sub">Nueve puertas. Detrás de cada una, una canción.</p>
    <p class="aviso-sonido" id="avisoSonido">Toca o haz clic en cualquier lugar para oír el ambiente</p>
    <div class="carga" id="carga" aria-live="polite"><span class="carga-barra"><i id="cargaBarra"></i></span><span id="cargaTxt">Preparando el lugar</span></div>
  </div>
  <div class="desliza" aria-hidden="true">Desliza</div>
</section>

<main id="habitacion" hidden aria-labelledby="hab-titulo">
  <canvas id="atmos" aria-hidden="true"></canvas>
  <div class="hab-scroll" id="habScroll" tabindex="0" aria-label="Letra">
    <article class="hab-contenido">
      <p class="hab-num"><span id="habNum">01</span> · MAVO · Polvo de estrella</p>
      <h2 class="hab-titulo" id="hab-titulo" tabindex="-1"></h2>
      <p class="letra" id="letra"></p>
      <p class="hab-nota" id="habNota">Letra sin sincronizar</p>
    </article>
  </div>
  <button class="btn btn-seguir" id="seguir" hidden>Seguir canción</button>
  <nav class="reproductor" aria-label="Reproducción">
    <button class="btn btn-volver" id="volver"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span>Puertas</span></button>
    <div class="transporte">
      <button class="icono" id="anterior" aria-label="Canción anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5v14M19 5l-9 7 9 7z"/></svg></button>
      <button class="icono icono-grande" id="play" aria-label="Pausa"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-pausa" d="M8 5v14M16 5v14"/><path class="i-play" d="M7 4.5v15l12-7.5z"/></svg></button>
      <button class="icono" id="siguiente" aria-label="Canción siguiente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 5v14M5 5l9 7-9 7z"/></svg></button>
    </div>
    <div class="barra">
      <span id="tiempo">0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Posición en la canción" aria-valuetext="0:00">
      <span id="duracion">0:00</span>
    </div>
    <div class="vol">
      <button class="icono" id="mudo" aria-label="Silenciar" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="altavoz" d="M4 9h4l5-4v14l-5-4H4z"/><path class="ondas" d="M16 8.5a5 5 0 0 1 0 7"/><path class="cruz" d="M16 9l5 6M21 9l-5 6"/></svg></button>
      <input type="range" id="vol" min="0" max="100" value="100" step="1" aria-label="Volumen" aria-valuetext="100 %">
    </div>
  </nav>
</main>

<div id="recorrido" aria-hidden="true"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
